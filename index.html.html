<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بتحبيني؟</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            height: 100vh;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .modal {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: pop 0.5s ease;
        }
        
        @keyframes pop {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }
        
        h1 {
            color: #ff1493;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
        }
        
        .no-btn {
            background: #ddd;
            color: #666;
        }
        
        .no-btn:hover {
            background: #ccc;
            transform: scale(1.05);
        }
        
        .yes-btn {
            background: #ff1493;
            color: white;
        }
        
        .yes-btn:hover {
            background: #ff69b4;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.6);
        }
        
        .page2 {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            color: white;
            text-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        
        .heart {
            position: absolute;
            font-size: 30px;
            animation: float 4s linear forwards;
            pointer-events: none;
            z-index: 100;
        }
        
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- First Page: Modal -->
    <div id="page1" class="modal">
        <h1>بتحبيني؟ 💕</h1>
        <div class="buttons">
            <button class="no-btn" onclick="noClick()">لا</button>
            <button class="yes-btn" onclick="yesClick()">نعم</button>
        </div>
    </div>

    <!-- Second Page -->
    <div id="page2" class="page2" style="background: linear-gradient(135deg, #ff69b4, #ff1493);">
        <audio id="loveSong" loop>
            <source src="https://archive.org/download/Album_AmrDiab_Amarain/Amarain.ogg" type="audio/ogg">
            <source src="https://archive.org/download/Album_AmrDiab_Amarain/%D9%82%D9%85%D8%B1%D9%8A%D9%86.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <h1 style="font-size: 32px; margin-bottom: 20px;">وأنا كمان بموت فيكي يا سمسومة 🥰💖</h1>
        <div id="hearts-container" style="position: relative; width: 100%; height: 100%;"></div>
    </div>

    <script>
        function noClick() {
            const noBtn = document.querySelector('.no-btn');
            if (!noBtn) return;
            
            // Make it run away
            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight;
            const btnWidth = noBtn.offsetWidth || 100;
            const btnHeight = noBtn.offsetHeight || 50;
            
            let x = Math.random() * (containerWidth - btnWidth - 50);
            let y = Math.random() * (containerHeight - btnHeight - 100);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
            noBtn.style.zIndex = '1000';
            noBtn.style.transition = 'left 0.4s ease, top 0.4s ease';
        }
        
        function yesClick() {
            document.getElementById('page1').style.display = 'none';
            const page2 = document.getElementById('page2');
            page2.style.display = 'flex';
            
            // Play the song
            const audio = document.getElementById('loveSong');
            audio.play().catch(e => console.log("Audio autoplay prevented", e));
            
            startHearts();
        }
        
        function startHearts() {
            const container = document.getElementById('hearts-container');
            const heartTypes = ['❤️', '💖', '💗', '💓', '💘', '💝', '💞', '💕', '🥰', '💘'];
            const colors = ['#ff1493', '#ff69b4', '#ffb6c1', '#ffc0cb', '#ff8da1'];
            
            setInterval(() => {
                for (let i = 0; i < 3; i++) {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.textContent = heartTypes[Math.floor(Math.random() * heartTypes.length)];
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.color = colors[Math.floor(Math.random() * colors.length)];
                    heart.style.fontSize = (25 + Math.random() * 25) + 'px';
                    heart.style.animationDuration = (3 + Math.random() * 3) + 's';
                    heart.style.opacity = 0.9;
                    container.appendChild(heart);
                    
                    setTimeout(() => {
                        heart.remove();
                    }, 7000);
                }
            }, 300);
        }
        
        // Start with page 1 visible
        window.onload = () => {
            document.body.style.display = 'flex';
        };
    </script>
</body>
</html>
